# A pull request that is green, up to date and unblocked merges itself. Nothing else does.
#
# WHAT WAS BROKEN. Crew had a gate (`crew-qa.yml`) and nothing that acted on it. #31 and #17 both
# went green on 2026-08-22 and then sat. Every landing needed a person or an agent to run
# `gh pr merge`, and the agent's permission classifier refused it, so each one came back to the
# founder as a request. Founder, 2026-08-23, in his own words: "i dont need friction, agents
# should be able to merge", "nothing ever gets solved", "we are looping". The loop is the defect,
# not the individual refusal, so the fix is a mechanism that needs neither of them.
#
# WHY NOT NATIVE AUTO-MERGE. `allow_auto_merge` is false on this repository, and GitHub only arms
# it on a pull request currently BLOCKED by a required status check. Required checks need branch
# protection, which this plan refuses with `403 Upgrade to GitHub Pro`. An already-green pull
# request cannot be armed at all, which is exactly the population that stalls.
#
# IT ALSO UPDATES BEHIND BRANCHES. Both stalled pull requests ended DIRTY, not because anyone
# wrote conflicting prose but because main moved under them while they waited. Merging without
# that step moves the stall one square left, so a BEHIND branch is refreshed here and lands on
# the next tick.
#
# WHAT IT REFUSES TO MERGE, each a real case rather than a precaution:
#   draft                      the author is still writing it
#   the hold / do-not-merge / wip label   the one-word way for any session or the founder to stop
#                              one merge without turning the mechanism off
#   mergeStateStatus DIRTY     a real conflict; a person or an agent has to choose
#   no checks at all           that is unproven, not green
#   any completed check that is not SUCCESS / SKIPPED / NEUTRAL
#   any check still running
#   no KEEP at the head sha     cg#169 landed an RCE 76s before its REWORK arrived (crew#526);
#                              a comment `REVIEW: KEEP at <head7>` is the review, and it must
#                              name the commit that is merging, not an earlier one
name: Merge when green

on:
  workflow_run:
    workflows: [guards, estate]
    types: [completed]
  # An event-only trigger cannot see a pull request that went green before this workflow existed,
  # and that is the whole backlog on the day it lands. The tick also covers a branch that only
  # became mergeable because something else merged.
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  # Never two merges at once: the second would compute its mergeability against a main the first
  # is in the middle of moving.
  group: merge-when-green
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge every pull request that is genuinely finished
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MAX_PER_RUN: '6'
        run: |
          set -euo pipefail
          gh pr list --state open --limit 50 \
            --json number,isDraft,mergeStateStatus,labels,statusCheckRollup,title,headRefOid \
            > prs.json
          python3 - <<'PY' > todo.txt
          import json, os, re, subprocess
          REPO = os.environ["GH_REPO"]
          HOLD = {"hold", "do-not-merge", "wip"}
          def keep_at_head(pr):
              # The review names a sha. It counts for this head when it is the head, or when every
              # commit after it only added under docs/evidence/ (pr-evidence.py attach commits there
              # after the KEEP, by design). Anything else after the KEEP is unreviewed code.
              head, n = pr["headRefOid"], str(pr["number"])
              out = subprocess.run(["gh", "pr", "view", n, "--json", "comments",
                                    "--jq", "[.comments[].body] | join(\"\\n\")"],
                                   capture_output=True, text=True, check=False).stdout
              for keep in re.findall(r"^REVIEW: KEEP at ([0-9a-f]{7,40})\b", out, re.M):
                  if head.startswith(keep):
                      return True
                  cmp = subprocess.run(["gh", "api", "repos/" + REPO + "/compare/" + keep + "..." + head,
                                        "--jq", "[.status] + [.files[].filename]"],
                                       capture_output=True, text=True, check=False).stdout
                  try:
                      status, *files = json.loads(cmp)
                  except ValueError:
                      continue
                  if status == "ahead" and files and all(f.startswith("docs/evidence/") for f in files):
                      return True
              return False
          for pr in json.load(open("prs.json")):
              why, verdict = None, "MERGE"
              labels = {l["name"].lower() for l in pr.get("labels") or []}
              checks = pr.get("statusCheckRollup") or []
              done = [c for c in checks if (c.get("status") or "COMPLETED") == "COMPLETED"]
              bad = [c for c in done
                     if (c.get("conclusion") or "") not in ("SUCCESS", "SKIPPED", "NEUTRAL")]
              state = pr["mergeStateStatus"]
              if pr["isDraft"]:
                  why = "draft"
              elif labels & HOLD:
                  why = "labelled " + ",".join(sorted(labels & HOLD))
              elif state == "BEHIND":
                  # Not a refusal. main moved while this waited, which is the exact way both
                  # stalled pull requests turned into conflicts. Refresh now, land next tick.
                  verdict, why = "UPDATE", "behind main"
              elif state == "DIRTY":
                  why = "a real conflict; a person or an agent has to choose"
              elif state != "CLEAN":
                  why = "state " + state
              elif not checks:
                  why = "no checks ran, so it is unproven rather than green"
              elif len(done) != len(checks):
                  why = str(len(checks) - len(done)) + " check(s) still running"
              elif bad:
                  why = "failing: " + ",".join(c.get("name", "?") for c in bad[:3])
              if why is None and verdict == "MERGE" and not keep_at_head(pr):
                  why = "no `REVIEW: KEEP at " + pr["headRefOid"][:7] + "` comment; a review of an older sha is not a review of this one"
              if why is not None and verdict == "MERGE":
                  verdict = "SKIP."
              # Every pull request is printed, merged or not. A queue that silently drops one is
              # how a branch waits a day for a reason nobody can see.
              print(verdict, pr["number"], why or "green, clean, unblocked",
                    "|", pr["title"][:60])
          PY
          cat todo.txt
          merged=0
          while read -r verdict number rest; do
            if [ "$verdict" = "UPDATE" ]; then
              gh api --method PUT "repos/$GH_REPO/pulls/$number/update-branch" --input /dev/null \
                && echo "refreshed #$number onto main; it lands on the next tick" \
                || echo "could not refresh #$number"
              continue
            fi
            [ "$verdict" = "MERGE" ] || continue
            if [ "$merged" -ge "$MAX_PER_RUN" ]; then
              echo "stopping at $MAX_PER_RUN this run; the next tick takes the rest"
              break
            fi
            # A pull request can go stale between the listing and this line, because a merge
            # earlier in this same loop just moved main. The command refuses on its own in that
            # case, and the refusal is reported and skipped rather than failing the whole run.
            if gh pr merge "$number" --squash --delete-branch; then
              merged=$((merged + 1))
              echo "landed #$number"
            else
              echo "could not land #$number; leaving it for the next tick"
            fi
          done < todo.txt
          echo "landed $merged pull request(s)"
