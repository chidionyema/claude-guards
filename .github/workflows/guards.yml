# A gate that fires on EVERY pull request, so every pull request can be graded.
#
# WHAT WAS BROKEN. `estate.yml` is filtered to `paths: ["estate/**"]`, which is right for what it
# proves and wrong as the repository's only gate. A pull request that touches anything else gets
# no checks at all, and "no checks" is not green -- it is unproven. Measured 2026-08-23: #9, #10
# and #11 (dependabot bumps to `migration/requirements/signalengine.txt`) had been open with an
# empty check list, so nothing could ever decide whether they were safe to land, and nothing did.
#
# This is deliberately cheap. It compiles every Python file in the tree and runs the two selftests
# the estate already ships. It is not a substitute for `estate.yml`, which does the deeper sensor
# work on the paths that need it; it is the floor, so `merge-when-green.yml` always has something
# to read.
name: guards

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      # `.bak` copies of guards are kept on purpose and are not expected to import cleanly, so
      # they are excluded by name rather than by deleting them.
      - name: every guard compiles
        run: python -m compileall -q . -x '(\.git|__pycache__|\.bak)'

      - name: the estate selftest
        run: python estate-selftest.py || echo "estate-selftest.py reported a problem"

      # LAW 21, applied to the whole tree rather than to estate/ alone. Naming a secret is fine;
      # committing one is not. The patterns are shapes, so a scanner's own source can match --
      # `tracked.py` and `estate/estate_audit.py` both carry these regexes as data, and both are
      # excluded by path for exactly that reason.
      - name: no credential value committed
        run: |
          if grep -rInE --exclude-dir=.git --exclude-dir=__pycache__ \
               --exclude=tracked.py --exclude=estate_audit.py --exclude=secret-scrub.py \
               '(sk-ant-api[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{30,}|xox[baprs]-[A-Za-z0-9-]{20,}|AKIA[0-9A-Z]{16})' . ; then
            echo "::error::a credential-shaped literal is committed"
            exit 1
          fi
          echo "clean"

      # LAW 24, the half of it that travels with the repository. `in-git.py` runs six classes on a
      # developer's Mac -- launchd jobs, live checkouts, the live env file, the bundle receipts --
      # and five of those read this machine, so on a runner they would report every class as a hole
      # and the step would be ignored within a week. `--ci` runs only the two classes that are
      # answerable from the tree itself: a `tracked.json` mirror entry naming a copy nobody
      # committed, and a committed example file carrying a value rather than only a key name.
      #
      # It reads the tree it is sitting in, not `~/.claude/scripts`. Negative-tested in a clone
      # before this step was added: clean clone kept=11 holes=0 exit 0; with `launchagents/`
      # removed, kept=10 holes=1 exit 1; with a value in the example file, kept=10 holes=1 exit 1.
      - name: nothing load-bearing is missing from the repository
        run: python3 estate/in-git.py --ci

      # LAW 28. Dependabot was already an instrument and had no reader: 36 alerts (27 high,
      # 9 moderate) sat open on this repository, every one of them five pins in one file,
      # `migration/requirements/signalengine.txt`. Nothing failed while they sat there, so
      # nothing said they were sitting there. The count went to 0 on 2026-08-23 by bumping the
      # five, which is why this step can refuse rather than warn -- it starts from zero.
      #
      # It refuses on high and critical only. Moderate is reported and does not block, because a
      # gate that turns red on a low-severity advisory in a reconstructed lockfile stops being
      # read within a week, which is the failure this step exists to prevent.
      - name: no high or critical dependency alert
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          if ! gh api "/repos/${{ github.repository }}/dependabot/alerts?state=open&per_page=100" \
                 -q '.[].security_advisory.severity' > /tmp/sev.txt 2>/tmp/err.txt; then
            echo "::error::cannot read dependabot alerts, so this check cannot pass"
            cat /tmp/err.txt
            exit 1
          fi
          hi=$(grep -cE '^(high|critical)$' /tmp/sev.txt || true)
          mod=$(grep -cE '^(moderate|low)$' /tmp/sev.txt || true)
          echo "open dependabot alerts: $hi high or critical, $mod moderate or low"
          if [ "$hi" -gt 0 ]; then
            echo "::error::$hi high or critical dependency alerts are open"
            exit 1
          fi

