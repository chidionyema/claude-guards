# A gate that fires on EVERY pull request, so every pull request can be graded.
#
# WHAT WAS BROKEN. `estate.yml` is filtered to `paths: ["estate/**"]`, which is right for what it
# proves and wrong as the repository's only gate. A pull request that touches anything else gets
# no checks at all, and "no checks" is not green -- it is unproven. Measured 2026-08-23: #9, #10
# and #11 (dependabot bumps to `migration/requirements/signalengine.txt`) had been open with an
# empty check list, so nothing could ever decide whether they were safe to land, and nothing did.
#
# This is deliberately cheap. It compiles every Python file in the tree and runs the two selftests
# the estate already ships. It is not a substitute for `estate.yml`, which does the deeper sensor
# work on the paths that need it; it is the floor, so `merge-when-green.yml` always has something
# to read.
name: guards

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      # `.bak` copies of guards are kept on purpose and are not expected to import cleanly, so
      # they are excluded by name rather than by deleting them.
      - name: every guard compiles
        run: python -m compileall -q . -x '(\.git|__pycache__|\.bak)'

      # LAW 45 step 5: an incident test that no workflow runs is a memory, not a guard. Measured
      # 2026-08-26 (crew#69): 37 test_*.py files on main and no job invoked pytest, so
      # test_incident_crew69_every_script_is_wired.py could only fail on a developer's Mac.
      - name: every incident test runs
        # Three files named test_*.py are standalone runners that call sys.exit at import
        # (test_bridge_edges.py, test_bridge_live.py, test_kimi_bridge_reap.py); pytest cannot
        # collect them, so they are named here rather than renamed.
        # Four more pass alone and fail inside the full run (order coupling, measured
        # 2026-08-26: 63 passed, 3 failed, 3 errors together; each passes alone), so they run in a
        # second invocation rather than being ignored. Untangling the coupling is crew#69's residual.
        # The tests locate the guards through $HOME/.claude/scripts, which is where this repo is
        # checked out on every machine that runs it (tracked.json: live checkout). The runner has
        # no such path, so the workspace is linked there; measured 2026-08-26 on #103: 22 of 40
        # test files resolve a guard or fixture through it.
        run: |
          mkdir -p "$HOME/.claude" && ln -sfn "$GITHUB_WORKSPACE" "$HOME/.claude/scripts"
          python -m pip -q install pytest
          python -m pytest -q -p no:cacheprovider \
            --ignore=test_bridge_edges.py --ignore=test_bridge_live.py --ignore=test_kimi_bridge_reap.py \
            --ignore=tests/test_incident_crew326_hook_router.py \
            --ignore=tests/test_incident_crew64_ignore_refusal_named.py \
            --ignore=test_incident_tracked_committed_into_a_checkout_it_does_not_own.py \
            --ignore=test_incident_rule_guard_tilde_cd_graded_the_wrong_repo.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_incident_crew326_hook_router.py \
            tests/test_incident_crew64_ignore_refusal_named.py \
            test_incident_tracked_committed_into_a_checkout_it_does_not_own.py \
            test_incident_rule_guard_tilde_cd_graded_the_wrong_repo.py

      - name: the estate selftest
        run: python estate-selftest.py || echo "estate-selftest.py reported a problem"

      # LAW 21, applied to the whole tree rather than to estate/ alone. Naming a secret is fine;
      # committing one is not. The patterns are shapes, so a scanner's own source can match --
      # `tracked.py` and `estate/estate_audit.py` both carry these regexes as data, and both are
      # excluded by path for exactly that reason.
      - name: no credential value committed
        run: |
          if grep -rInE --exclude-dir=.git --exclude-dir=__pycache__ \
               --exclude=tracked.py --exclude=estate_audit.py --exclude=secret-scrub.py \
               '(sk-ant-api[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{30,}|xox[baprs]-[A-Za-z0-9-]{20,}|AKIA[0-9A-Z]{16})' . ; then
            echo "::error::a credential-shaped literal is committed"
            exit 1
          fi
          echo "clean"

      # LAW 24, the half of it that travels with the repository. `in-git.py` runs six classes on a
      # developer's Mac -- launchd jobs, live checkouts, the live env file, the bundle receipts --
      # and five of those read this machine, so on a runner they would report every class as a hole
      # and the step would be ignored within a week. `--ci` runs only the two classes that are
      # answerable from the tree itself: a `tracked.json` mirror entry naming a copy nobody
      # committed, and a committed example file carrying a value rather than only a key name.
      #
      # It reads the tree it is sitting in, not `~/.claude/scripts`. Negative-tested in a clone
      # before this step was added: clean clone kept=11 holes=0 exit 0; with `launchagents/`
      # removed, kept=10 holes=1 exit 1; with a value in the example file, kept=10 holes=1 exit 1.
      - name: nothing load-bearing is missing from the repository
        run: python3 estate/in-git.py --ci

      # R2, made mechanical. A ruling binds every session forever, and its id is a
      # hand-typed sequential number allocated by six sessions that cannot see each
      # other. R15 collided on 2026-08-23 and R16 collided on 2026-08-24: both times
      # two real rulings shared a number and one of them stopped being injected.
      # This refuses the file, not the symptom. The selftest proves both directions --
      # a collision is reported, a sound list is not -- and it reads rulings.json from
      # beside the script, so on a runner it grades the checkout and not nothing.
      - name: no two founder rulings share a number
        run: python3 friction-relay.py --selftest

      # LAW 19, made mechanical. A vendor arrives in this estate the moment somebody writes a
      # URL or an environment variable name, and until 2026-08-23 nothing anywhere listed them:
      # 33 hosts and 19 credential names were in the tree and in no document. This refuses a
      # pull request that adds another one without saying, in drills/dependencies.json, either
      # which drill proves we survive losing it or why it cannot stop us.
      #
      # Tree only -- no network, no credentials -- so it runs on a bare runner.
      #
      # Negative-tested before this step was added: a file containing one unknown host and one
      # unknown credential name -> exit 1 naming both; a covered_by pointing at a drill that is
      # not on the register -> exit 1; clean tree -> exit 0.
      - name: every dependency is drilled or dismissed
        run: python3 drills/audit.py --ci
