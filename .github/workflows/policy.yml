# Policy as code, applied to this repository's own policy code.
#
# `guards.yml` proves every Python file compiles. That is a floor, and it says
# nothing about whether the file should exist. This job answers the question the
# founder actually asked on 2026-08-24 -- "policcy as code", after "we need to be
# deleting pything scripts tbh" -- by refusing the next hand-rolled guard instead
# of asking a reviewer to notice it.
#
# The rules are in policy/hand_rolled_policy.rego and are evaluated by OPA
# through conftest. Nothing here is a bespoke checker; the whole gate is a data
# file, a Rego policy and two fixtures.
#
# WHY IT PROVES ITSELF BOTH WAYS. A gate only ever seen refusing has never been
# shown to permit, and a gate that refuses correct work is an outage (LAW 38).
# So every run evaluates two fixtures as well as the tree: one that must fail and
# one that must pass. If either fixture stops behaving, this job fails even when
# the tree is clean.
name: policy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hand-rolled-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CONFTEST_VERSION: "0.69.0"
      OPA_VERSION: "1.19.1"
    steps:
      # fetch-depth: 0 because three selftest cases name a remote-tracking branch and
      # the rules ask git whether it resolves. Measured in a clone with
      # refs/remotes/origin/* deleted: 95/98, the three cases abstaining. With the
      # refs present: 98/98. A guard that cannot see its subject permits in silence.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install conftest
        run: |
          curl -sSfL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz conftest
          sudo mv conftest /usr/local/bin/
          conftest --version

      - name: install opa
        run: |
          curl -sSfL -o opa \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x opa && sudo mv opa /usr/local/bin/
          opa version

      # The inventory is two facts per guard: how many lines it is, and whether
      # anything in this repository runs it. Built with find and jq rather than a
      # script, because a Python script that polices Python scripts is the habit
      # this job exists to break.
      #
      # Hyphenated names only. This estate's convention is that an executable is
      # `some-guard.py` and a library is `guard_report.py`; guard_report.py is
      # imported by 22 files and is not a guard.
      # `git ls-files -s` and not `find`, because git's index is what CI checks
      # out and the filesystem is not. Two guards in this repo are committed as
      # symlinks to absolute paths on one Mac (mode 120000); `find` reports them
      # as present and `wc -l` then fails on a dangling link, which is how the
      # first version of this job died. Mode is read from the index, so a symlink
      # is recorded as one rather than followed.
      - name: build the inventory
        run: |
          git ls-files -s \
            | awk '$4 ~ /(-guard|-gate|-fence)[^\/]*\.py$|\/?guard-[^\/]*\.py$/ && $4 !~ /(^|\/)test_|\.bak/ {print $1, $4}' \
            | sort -k2 > guards.txt
          while read -r mode f; do
            if [ "$mode" = "120000" ]; then
              printf '{"path":"%s","lines":0,"rules":0,"symlink":true,"target":"%s"}\n' "$f" "$(readlink "$f")"
            else
              printf '{"path":"%s","lines":%s,"rules":%s,"symlink":false}\n' \
                "$f" "$(wc -l < "$f" | tr -d ' ')" "$(grep -c '^def rule_' "$f" || true)"
            fi
          done < guards.txt | jq -s '{guards: .}' > guards.json
          grep -ohE '[A-Za-z0-9_.-]+\.py' settings/settings.json jobs/jobs.json \
            | sort -u | jq -R -s 'split("\n") | map(select(length > 0))' > wired.json
          git ls-files 'policy/*.py' \
            | jq -R -s 'split("\n") | map(select(length > 0))' > policy_py.json
          # Every hook command in settings/settings.json runs
          # $HOME/.claude/scripts/<name>, and that directory IS this repository's
          # checkout. So a hook name that is not a tracked file here is a hook
          # that cannot run. Matched on the prefix and not on a bare `.py` grep,
          # because settings.json also holds permission globs like `Read(**/.py`.
          grep -ohE '\$HOME/\.claude/scripts/[A-Za-z0-9_.-]+\.py' settings/settings.json \
            | sed 's|.*/||' | sort -u \
            | jq -R -s 'split("\n") | map(select(length > 0))' > hooks_wired.json
          git ls-files '*.py' | sed 's|.*/||' | sort -u \
            | jq -R -s 'split("\n") | map(select(length > 0))' > tracked_py.json
          jq -s '{guards: .[0].guards, wired: .[1], policy_dir_py: .[2], hooks_wired: .[3], tracked_py: .[4]}' \
            guards.json wired.json policy_py.json hooks_wired.json tracked_py.json > inventory.json
          echo "guards found: $(jq '.guards | length' inventory.json)"

      # Every rule in policy/*.rego is a unit test away from silently permitting
      # everything: an uncompilable RE2 pattern makes regex.match undefined rather
      # than raising. test_no_rule_is_broken is what catches that, so it gates here.
      - name: the rego unit tests
        run: conftest verify --policy policy

      - name: the policy must refuse, and it must be THIS rule that refuses
        run: |
          conftest test --policy policy --output json policy/fixtures/must_deny.json \
            > deny.json || true
          jq -r '.[].failures[]?.msg' deny.json > refusals.txt
          fail=0
          while IFS= read -r want; do
            case "$want" in ''|'#'*) continue;; esac
            if grep -qF "$want" refusals.txt; then
              echo "  refused: $want"
            else
              echo "::error::the policy PERMITTED a case it must refuse: $want"
              fail=1
            fi
          done < policy/fixtures/must_deny.expected
          exit $fail

      # claude-guards#60. Ruling numbers are allocated in rulings.json and nowhere else.
      # The register is this file's ids; the docs are the crew repository's
      # docs/rulings filenames (public, read over the API). policy/rulings.rego
      # refuses a number claimed twice and a doc whose number the register lacks;
      # policy/rulings_test.rego proves both the refusal and the permit in
      # `the rego unit tests` above.
      - name: ruling numbers are allocated once, in rulings.json
        run: |
          jq '{register: [.rulings[].id]}' rulings.json > reg.json
          curl -sSf https://api.github.com/repos/chidionyema/crew/contents/docs/rulings \
            | jq '[.[].name | select(test("^R[0-9]+-"))]' > docs.json
          jq -s '{register: .[0].register, docs: .[1]}' reg.json docs.json > rulings-input.json
          echo "register: $(jq '.register | length' rulings-input.json) ids, crew docs: $(jq '.docs | length' rulings-input.json)"
          conftest test --policy policy --namespace rulings rulings-input.json

      - name: the policy must permit a shrinking guard
        run: conftest test --policy policy policy/fixtures/must_allow.json

      # Warnings are printed and do not fail. They name guards that are wired to
      # nothing; see the comment on the `warn` rule for why that is not yet a
      # denial and what promotes it.
      - name: the tree itself
        run: conftest test --policy policy inventory.json

      # R18, "always research, it pays off all the time". A decision record that
      # cites nothing is a decision nobody can check. The rule is in
      # policy/hooks.rego and its cases run in `the rego unit tests` above
      # (conftest verify); this step exercises the find/grep/jq collector that
      # feeds it, and stops an uncited record landing in THIS repo.
      #
      # Residual, stated rather than implied: it sees this repo only. idp, crew
      # and prospector-main hold the estate's 15 decision records and are not
      # gated yet -- run `make decisions SCAN=<repo>` there until they are.
      - name: a decision record cites its sources
        run: make decisions

      # The hook's own cases, run the way the hook runs: this is what proves the
      # nine migrated refusals still refuse through opa, on a machine that is not
      # the founder's laptop.
      - name: rule-guard.py against the live policy
        run: python3 rule-guard.py --selftest
